[build-system]
requires = ["setuptools >= 84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "virne"
version = "1.0.0"
description = "A comprehensive simulator and benchmark for Resource Allocation in Network Function Virtualization (NFV-RA)."
readme = "README.md"
requires-python = ">= 3.12"
authors = [{ name = "GeminiLight", email = "wtfly2018@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["Network Function Virtualization", "Virtual Network Embedding", "Reinforcement Learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'Topic :: Software Development :: Libraries',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Software Development :: Libraries :: Python Libraries',
    'Topic :: Software Development :: Libraries :: Python Frameworks',
]
dependencies = [
    "gymnasium == 1.3.0",
    "numpy >= 2.5.2, < 3.0",
    "pandas >= 3.0.5",
    "matplotlib >= 3.11.1",
    "scipy >= 1.18.0",
    "pyyaml >= 6.0.3",
    "torch == 2.13.0",
    "tensorboard >= 2.21.0",
    "wandb >= 0.28.1",
    "networkx >= 3.6.1",
    "tqdm >= 4.70.0",
    "ortools >= 9.15.6755",
    "scikit-learn >= 1.9.0",
    "hydra-core >= 1.3.5",
    "colorlog >= 6.12.0",
    "torch_geometric == 2.8.0.post1"
]


[project.scripts]
virne = "virne.cli:main"

[project.urls]
Homepage = "https://github.com/GeminiLight/virne"
Repository = "https://github.com/GeminiLight/virne"
Documentation = "https://virne.readthedocs.io"
"Bug Report" = "https://github.com/GeminiLight/virne/issues"

[project.optional-dependencies]
lint = [
]
# test = ['pytest', 'pytest-cov', 'pytest-xdist']

[dependency-groups]
dev = [
    "build == 1.5.0",
    "pytest == 9.1.1",
    "ruff == 0.16.2",
]
docs = [
    "sphinx == 9.1.0",
    "myst-parser == 5.1.0",
    "sphinx-design == 0.7.0",
    "sphinx-copybutton == 0.5.2",
    "furo == 2025.12.19",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["virne", "virne.*"]

[tool.setuptools.package-data]
virne = ["configs/*.yaml", "configs/*/*.yaml"]

# Linter tools #################################################################

[tool.black]
safe = true
line-length = 100
skip-string-normalization = true
target-version = ["py312"]

[tool.isort]
atomic = true
profile = "black"
src_paths = ["virne", "tests"]
extra_standard_library = ["typing_extensions"]
indent = 4
line_length = 100
lines_after_imports = 2
multi_line_output = 3

[tool.mypy]
python_version = "3.12"
pretty = true
show_error_codes = true
show_error_context = true
show_traceback = true
allow_redefinition = true
check_untyped_defs = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pydocstyle]
convention = "google"

[tool.doc8]
max-line-length = 500

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["virne", "tests", "examples"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "UP",      # pyupgrade
    "ANN",     # flake8-annotations
    "S",       # flake8-bandit
    "BLE",     # flake8-blind-except
    "B",       # flake8-bugbear
    "COM",     # flake8-commas
    "C4",      # flake8-comprehensions
    "EXE",     # flake8-executable
    "ISC",     # flake8-implicit-str-concat
    "PIE",     # flake8-pie
    "PYI",     # flake8-pyi
    "Q",       # flake8-quotes
    "RSE",     # flake8-raise
    "RET",     # flake8-return
    "SIM",     # flake8-simplify
    "TID",     # flake8-tidy-imports
    "RUF",     # ruff
]
ignore = [
    # E501: line too long
    # W505: doc line too long
    # too long docstring due to long example blocks
    "E501",
    "W505",
    # TODO: Remove this four ignores
    # ANN001: missing type annotation for function argument
    # ANN003: missing type annotation for `**kwargs`
    # ANN201: missing return type annotation for public function
    # ANN202: missing return type annotation for private function
    "ANN001","ANN003","ANN201","ANN202",
    # ANN401: dynamically typed expressions (typing.Any) are disallowed
    "ANN401",
    # S101: use of `assert` detected
    # internal use and may never raise at runtime
    "S101",
    # PLR0402: use from {module} import {name} in lieu of alias
    # use alias for import convention (e.g., `import torch.nn as nn`)
    "PLR0402",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
multiline-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore: distutils Version classes are deprecated. Use packaging.version instead.",
    "ignore::DeprecationWarning"
]
