# Physical Network Configuration - Tree Topology with Clean Switches
# Switches (internal nodes) will have CPU set to 0 for routing-only
# Hosts (leaf nodes) will have normal CPU resources

topology:
  num_nodes: 32               # Number of HOST nodes (leaf nodes)
  type: tree                  # Tree topology
  branching_factor: 2         # Binary tree (2 children per switch)
  wm_alpha: 0.5               # Not used for tree, but required by config
  wm_beta: 0.2                # Not used for tree, but required by config

node_attrs_setting:
  - name: cpu
    type: resource
    owner: node
    distribution: uniform
    dtype: int
    generative: true
    high: 100
    low: 50
  - name: max_cpu
    type: extrema
    owner: node
    originator: cpu

link_attrs_setting:
  - name: bw
    type: resource
    owner: link
    distribution: uniform
    dtype: int
    generative: true
    high: 100
    low: 50
  - name: max_bw
    type: extrema
    owner: link
    originator: bw

output:
  save_dir: dataset/p_net
  file_name: tree_p_net.gml